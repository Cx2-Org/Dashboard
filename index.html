<!doctype html><html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>Tàu Sunny</title>
<style>
:root{--bg:#0e0f11;--panel:#17181b;--surface:#212126;--line:#2E2E33;--brand:#5BE316;--muted:#8a8a94;--fg:#f2f2f2;--warn:#f0b54a;--bad:#f08a80}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
#gate{position:fixed;inset:0;display:grid;place-items:center;padding:16px;z-index:10;background:radial-gradient(circle at 50% 30%,#1a2a1c,#0e0f11 60%)}
#gate form{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px;display:flex;flex-direction:column;gap:12px}
#gate h1{margin:0;font-size:20px}#gate p{margin:0;color:var(--muted);font-size:13px}
#gate label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
#gate input[type=text],#gate input[type=password]{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
#gate input:focus{outline:2px solid var(--brand);outline-offset:1px}#gate .row{flex-direction:row;align-items:center;gap:8px;color:var(--fg)}
#gate button{font:inherit;font-weight:700;background:var(--brand);color:#000;border:0;border-radius:10px;padding:11px;cursor:pointer}
#gate .link{background:none;color:var(--muted);font-weight:400;padding:2px;font-size:12px}#gate .err{color:var(--bad);font-size:13px;min-height:1em}
#app{display:grid;height:100%;grid-template-columns:1fr 340px}
#scene{position:relative;min-height:0}#scene canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:absolute;left:12px;top:12px;display:flex;align-items:center;gap:8px;background:rgba(14,15,17,.75);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--brand);box-shadow:0 0 8px var(--brand)}.dot.off{background:var(--bad);box-shadow:0 0 8px var(--bad)}
aside{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:14px;display:flex;flex-direction:column;gap:14px}
aside h2{margin:0;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.card b{display:block}.card .s{color:var(--muted);font-size:12px}.card a{color:var(--fg)}
.bar{height:5px;background:#2b2e35;border-radius:3px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--brand)}
table{width:100%;border-collapse:collapse;font-size:12.5px}td{padding:6px 4px;border-top:1px solid var(--line);vertical-align:top}
.hi{color:var(--brand)}.mid{color:var(--warn)}.lo{color:var(--bad)}
.out{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:6px 10px;font:inherit;font-size:12px;cursor:pointer}
@media (max-width:860px){#app{grid-template-columns:1fr;grid-template-rows:58vh 1fr}aside{border-left:0;border-top:1px solid var(--line)}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script src="state.js?v=4"></script>
</head><body>
<div id="app"><div id="scene"><div id="hud"><span class="dot" id="live"></span><b id="cnt">…</b><span id="upd" style="color:var(--muted)">đang tải…</span></div></div>
  <aside><a class="card" href="devices.html" style="text-decoration:none;color:var(--fg)"><b>📱 Xem máy đang chạy</b><span class="s">màn hình giả lập từng máy</span></a><h2>Băng hải tặc</h2><div id="staff"></div><h2>Hàng hải</h2><div class="card" id="queue"></div>
  <h2>Xong 48 giờ</h2><table id="done"></table></aside></div>
<script>window.addEventListener('error',e=>{const u=document.getElementById('upd');if(u)u.textContent='Lỗi: '+(e.message||'không tải được');});</script>
<script type="module" src="app.js?v=6"></script>
</body></html>
